# --- Stili Word che indicano un titolo di sezione ---
heading_styles:
  - "Heading 1"
  - "Heading 2"
  - "Heading 3"
  - "Heading 4"
  - "Titolo 1"
  - "Titolo 2"
  - "Titolo 3"

# --- Stili da ignorare (metadati, revisioni, ecc.) ---
# I paragrafi con questi stili vengono salvati ma con flag ignored=true
ignore_styles: []

# --- Rilevamento parametri di configurazione ---
# Pattern regex per linee tipo: NOME_PARAMETRO = valore
# o NOME_PARAMETRO= valore  o  NOME_PARAMETRO=valore
parameter_patterns:
  # Formato: NOME_TUTTO_MAIUSCOLO = qualcosa
  - pattern: '^([A-Z][A-Z0-9_]{2,})\s*=\s*(.+)$'
    name: "key_value_uppercase"
    description: "Parametri stile NOME=VALORE (tutto maiuscolo)"

  # Formato: export NOME=valore (stile shell)
  - pattern: '^export\s+([A-Z][A-Z0-9_]{2,})\s*=\s*(.+)$'
    name: "shell_export"
    description: "Parametri stile shell: export NOME=VALORE"

  # Formato tabellare: nome parametro in colonna 0, valore in colonna 1
  # Usato quando una tabella ha 2+ colonne e la prima cella è TUTTO_MAIUSCOLO
  # Questo pattern non è regex — è gestito separatamente dall'extractor
  - pattern: 'table_col0_col1'
    name: "table_key_value"
    description: "Parametri in tabella — nome cella[0], valore cella[1] (attivato quando col0 è maiuscolo)"

  # Formato snake_case minuscolo (stile nomi campo DB) — risolve Fontana
  # Valore vincolato a: numero intero, stringa quoted, o lettera singola
  # Questo esclude "se X = Y" perché Y è quasi sempre testo libero
  - pattern: '^([a-z][a-z0-9_]{2,})\s*=\s*([0-9]+|''[^'']*''|"[^"]*"|[A-Z])\s*$'
    name: "key_value_snakecase"
    description: "Parametri stile DB: campo_nome = valore numerico o stringa quoted"

  # Parametri maiuscoli inline nel testo — cattura NOME=valore anche dentro frasi
  # Valore vincolato a numero intero (quasi tutti i parametri config MES sono 0/1/2...)
  # Non cattura NOME=testo_libero per evitare falsi positivi narrativi
  - pattern: '([A-Z][A-Z0-9_]{2,})\s*=\s*([0-9]+)'
    name: "inline_uppercase_param"
    description: "Parametri maiuscoli inline nel testo — NOME=valore numerico anche in mezzo a frasi"

# --- Filtri contenuto ---
extraction:
  # Paragrafi con testo più corto di N caratteri vengono comunque salvati
  # ma con flag short_text=true (potrebbero essere rumore)
  min_text_length: 2

  # Ignora paragrafi completamente vuoti
  skip_empty: true

  # Estrai il contenuto delle tabelle
  extract_tables: true

  # Encoding fallback se il docx ha caratteri speciali
  encoding_fallback: "latin-1"

# --- Database output ---
database:
  path: "data/mes_docs.db"

  # ATTENZIONE: recreate_on_run: true cancella e ricrea il DB ad ogni run.
  # Utile in sviluppo per partire pulito.
  # Mettere su FALSE in produzione, altrimenti si perdono tutti i dati ad ogni esecuzione.
  # Modalità incrementale (false): aggiorna solo i documenti modificati (confronto per data file).
  recreate_on_run: true  # <-- cambia in false prima di andare in produzione

  # Strategia per le revisioni dei documenti (es. r06 → r07)
  # "replace"   : sovrascrive il documento precedente (stesso filename senza revisione)
  # "keep_all"  : mantiene tutte le revisioni — permette di confrontare r06 vs r07
  # Default: replace (più semplice, meno spazio)
  revision_strategy: "replace"

# --- Export JSON ---
json_export:
  enabled: false
  output_dir: "export/"
  # one_file_per_document: esporta un JSON per ogni documento
  # single_file: tutto in un unico file (può essere grande)
  mode: "one_file_per_document"

# --- Logging ---
logging:
  level: "INFO"   # DEBUG, INFO, WARNING, ERROR
  log_file: "data/extraction.log"
